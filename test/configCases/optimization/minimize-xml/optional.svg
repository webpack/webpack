<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="100" height="50" viewBox="0 0 100 50" onload="init()">
	<title>Optional removals</title>
	<desc>Every switch is opt-in</desc>
	<script>function init() {}</script>
	<defs>
		<linearGradient id="unusedGradient"><stop offset="0" stop-color="red"/><stop offset="1" stop-color="blue"/></linearGradient>
		<linearGradient id="usedGradient"><stop offset="0" stop-color="red"/><stop offset="1" stop-color="blue"/></linearGradient>
		<path id="usedPath" d="M0 0h10v10z"/>
	</defs>
	<a xlink:href="javascript:void 0"><rect width="10" height="10" fill="url(#usedGradient)"/></a>
	<use xlink:href="#usedPath" x="20"/>
	<image xlink:href="photo.png" width="10" height="10"/>
	<rect width="0" height="10"/>
	<g display="none"><circle r="5"/></g>
	<circle r="5" opacity="0"/>
</svg>
