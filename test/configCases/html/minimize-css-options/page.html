<!DOCTYPE html>
<html lang="en">
<head>
<style>
	/* the same rewrite a `.css` asset gets: sixteen pixels are one pica */
	.t01 { width: 16px }
	/* ten millimeters are one centimeter */
	.t02 { width: 10mm }
	/* a length no other unit spells shorter keeps its own */
	.t03 { width: 17px }
	/* a custom property is rewritten here as it is in a `.css` asset */
	.t04 { --a: #ffffff }
	/* a color the hex only approximates converts here as it does there */
	.t05 { background: hwb(194 0% 0%) }
	/* a declaration a later one overrides goes here as it does in a `.css`
	   asset, this target naming no browser to answer for it */
	.t06 { color: #c65d06; color: lab(50% 100 -100) }
</style>
</head>
<body>
<p style="width: 16px">a style attribute is handed the same option</p>
<p style="width: 17px">...and declines the same cases</p>
<p style="--a: #ffffff">...and rewrites a custom property the same way</p>
<p style="background: hwb(194 0% 0%)">...and approximates a color the same way</p>
<p style="color: #c65d06; color: lab(50% 100 -100)">...and drops an overridden declaration the same way</p>
</body>
</html>
