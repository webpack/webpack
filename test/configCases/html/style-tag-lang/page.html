<!DOCTYPE html>
<html>
<head>
<style>
.plain { color: red; }
</style>
<style lang="css">
.css-lang { color: blue; }
</style>
<style lang="less">
@accent: green;
.less-lang { color: @accent; .nested { background: url("./pixel.png"); } }
</style>
<style lang="SCSS">
$accent: purple; .scss-lang { color: $accent; }
</style>
<style lang="styl">
$accent: teal; .styl-lang { color: $accent; }
</style>
<style lang="stylus">
$accent: navy; .stylus-lang { color: $accent; }
</style>
<style lang="postcss">
$accent: olive; .postcss-lang { color: $accent; }
</style>
</head>
<body></body>
</html>
