codecov:
  branch: main
coverage:
  precision: 2
  round: down
  range: "70...100"
  status:
    project:
      default:
        # Every suite that uploads a report, so the status matches the comment.
        # Leaving the spec-conformance suites out made the status blind to the
        # code they cover: a change to the CSS or HTML parser reads as a drop,
        # because the suite that exercises it does not count toward the total.
        flags:
          - unit
          - integration
          - css-parsing
          - html5lib
          - test262
          - xmlconf
        target: auto
    patch:
      default:
        flags:
          - unit
          - integration
        target: 90%
        base: pr
    changes:
      default:
        flags:
          - unit
          - integration
        informational: true
ignore:
  - "**/*.runtime.js"
  - "schemas/**/*"
  - "examples/**/*"
  # Benchmark harnesses, not code webpack ships: what they measure is another
  # tool, and most of each one is only reachable from a ten-minute sweep or a
  # spawned worker. A test that loads one entered its whole file in the metric.
  - "tooling/compare-css-tools.js"
  - "tooling/compare-html-tools.js"
  - "tooling/compare-js-tools.js"
  - "tooling/compare-xml-tools.js"
  # TODO in the next major release: remove
  - "lib/template/ChunkTemplate.js"
  - "lib/template/MainTemplate.js"
  - "lib/template/ModuleTemplate.js"
