codecov:
  branch: main
coverage:
  precision: 2
  round: down
  range: "70...100"
  status:
    project:
      default:
        # Every suite that uploads a report, so the status matches the comment.
        # Leaving the spec-conformance suites out made the status blind to the
        # code they cover: a change to the CSS or HTML parser reads as a drop,
        # because the suite that exercises it does not count toward the total.
        flags:
          - unit
          - integration
          - css-parsing
          - html5lib
          - test262
        target: auto
    patch:
      default:
        flags:
          - unit
          - integration
        target: 90%
        base: pr
    changes:
      default:
        flags:
          - unit
          - integration
        informational: true
ignore:
  - "**/*.runtime.js"
  - "schemas/**/*"
  - "examples/**/*"
  # TODO webpack 6 remove
  - "lib/ChunkTemplate.js"
  - "lib/MainTemplate.js"
  - "lib/ModuleTemplate.js"
