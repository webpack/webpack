name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [main]
  schedule:
    - cron: "0 0 * * 1"

concurrency:
  # Only pull request runs share a group. A group holds one pending run, so
  # with a shared group a third push to `main` would evict the one queued
  # behind the run in progress; every other run keys on its own run id.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  # A superseded pull request analysis is work on code nobody will merge. A
  # push to `main` is not superseded: code scanning reads a pull request's
  # alerts against the default branch's last analysis, so that one must land.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze
    uses: nodejs/web-team/.github/workflows/codeql.yml@bb854ae62671e06aeeb24e8ef45be1e3a404f89d
    permissions:
      actions: read
      contents: read
      security-events: write
