name: Benchmarks

on:
  push:
    branches: [main]
  # A pull request reaches this through `test.yml`, which holds it behind the
  # three cheap jobs rather than spending four runner-hours on a tree that is
  # not going to merge. There is no `pull_request` trigger here, or every pull
  # request would run these shards twice.
  workflow_call:
  # The only trigger that measures the `-on-schedule` cases; every other one
  # filters them out as too expensive to run per pull request.
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

concurrency:
  # Named rather than `github.workflow`, which reads as the caller's name when
  # `test.yml` calls this — sharing that group would have the run cancel itself.
  # Only pull request runs share a group. A group holds one pending run, so
  # with a shared group a third push to `main` would evict the one queued
  # behind the run in progress; every other run keys on its own run id.
  group: Benchmarks-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  # Cancelling a push to `main` would leave that commit with
  # no run for CodSpeed to compare against — it then falls back to an older
  # `main`, attributing the commits in between to the pull request. Only a
  # superseded pull request run is dropped.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  id-token: write # Required for OIDC authentication with CodSpeed

jobs:
  benchmark:
    strategy:
      fail-fast: false
      matrix:
        shard: [1/4, 2/4, 3/4, 4/4]
    # Simulation counts instructions rather than time, so a shared GitHub runner
    # measures it as steadily as a dedicated one and costs nothing. It leaves
    # system calls out of the measure, which walltime would need CodSpeed's paid
    # macro runners for.
    runs-on: ubuntu-latest
    # The harness has no deadline of its own and a watch bench waits on a
    # rebuild callback; main's slowest shard is ~55m, so this only trips on a hang.
    timeout-minutes: 120
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-tags: true
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: yarn

      - run: node tooling/retry.js yarn --frozen-lockfile

      - run: yarn link --frozen-lockfile || true

      - run: yarn link webpack --frozen-lockfile

      - name: Check Memory Status
        run: >
          node -e 'const os=require("os");
          const toGb=b=>(b/1024**3).toFixed(2)+" GB";
          console.log(`--- Memory Status ---\nTotal: ${toGb(os.totalmem())}\nFree:  ${toGb(os.freemem())}\nUsed:  ${toGb(os.totalmem()-os.freemem())}`)'

      - name: Run benchmarks
        uses: CodSpeedHQ/action@821a40cd6c80e3cfe387caf55668287addd808da # v5.5.0
        with:
          run: yarn benchmark --ci
          mode: "simulation"
        env:
          LAST_COMMIT: 1
          NEGATIVE_FILTER: ${{ github.event_name != 'schedule' && 'on-schedule' || '' }}
          SHARD: ${{ matrix.shard }}
          # Single libuv thread → deterministic fs-completion order, removing the
          # last I/O race that perturbs allocation counts between runs.
          UV_THREADPOOL_SIZE: 1
  benchmark-memory:
    strategy:
      fail-fast: false
      matrix:
        shard: [1/2, 2/2]
    # Hosted runners mix Intel and AMD hosts, and the same JS can make a different
    # number of native allocations on each; the CPU step below names the host, and
    # the sequential file systems keep the rest of a build's order fixed.
    runs-on: ubuntu-latest
    # The harness has no deadline of its own, so this only trips on a hang.
    timeout-minutes: 120
    env:
      LAST_COMMIT: 1
      NEGATIVE_FILTER: ${{ github.event_name != 'schedule' && 'on-schedule' || '' }}
      # Single libuv thread → deterministic fs-completion order, removing the
      # last I/O race that perturbs allocation counts between runs.
      UV_THREADPOOL_SIZE: 1
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-tags: true
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: yarn

      - run: node tooling/retry.js yarn --frozen-lockfile

      - run: yarn link --frozen-lockfile || true

      - run: yarn link webpack --frozen-lockfile

      - name: Check Memory Status
        run: >
          node -e 'const os=require("os");
          const toGb=b=>(b/1024**3).toFixed(2)+" GB";
          console.log(`--- Memory Status ---\nTotal: ${toGb(os.totalmem())}\nFree:  ${toGb(os.freemem())}\nUsed:  ${toGb(os.totalmem()-os.freemem())}`)'

      # Runners differ by host CPU, and identical JS work can make a different number
      # of native allocations on two runs; log the model to match outliers to hosts.
      - name: Check CPU
        run: lscpu | grep -E '^(Model name|CPU\(s\)|Thread\(s\) per core|Core\(s\) per socket|Socket\(s\)):'

      # Each case is measured in its own fresh process, so its result does not
      # depend on the shard. All cases in one job exceed CodSpeed's upload limit.
      - name: Run memory benchmarks
        uses: CodSpeedHQ/action@821a40cd6c80e3cfe387caf55668287addd808da # v5.5.0
        with:
          run: yarn benchmark --ci
          mode: "memory"
          token: ${{ secrets.CODSPEED_TOKEN }}
        env:
          SHARD: ${{ matrix.shard }}
