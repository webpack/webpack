name: Benchmarks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Every push to `main` shares one group, so cancelling leaves that commit with
  # no run for CodSpeed to compare against — it then falls back to an older
  # `main`, attributing the commits in between to the pull request. Only a
  # superseded pull request run is dropped.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  id-token: write # Required for OIDC authentication with CodSpeed

jobs:
  benchmark:
    strategy:
      fail-fast: false
      matrix:
        shard: [1/4, 2/4, 3/4, 4/4]
    runs-on: ubuntu-24.04
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-tags: true
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Pinned, not `lts/*`: CodSpeed compares this run against one recorded
          # days ago, and a Node patch moves memory peaks and instruction counts
          # on unchanged code. Bumping it re-baselines every benchmark at once.
          node-version: 24.19.0
          cache: yarn

      - run: yarn --frozen-lockfile

      - run: yarn link --frozen-lockfile || true

      - run: yarn link webpack --frozen-lockfile

      # The runner's CPU model still varies between runs; a whole shard moving at
      # once is that, not the diff. Recorded here so the log can say which.
      - name: Check Runner Environment
        run: |
          ldd --version | head -1
          node -e 'const os=require("os");
          const toGb=b=>(b/1024**3).toFixed(2)+" GB";
          console.log(`--- Runner ---\nNode:  ${process.version} (V8 ${process.versions.v8})\nCPU:   ${os.cpus()[0].model} x${os.cpus().length}\nTotal: ${toGb(os.totalmem())}\nFree:  ${toGb(os.freemem())}\nUsed:  ${toGb(os.totalmem()-os.freemem())}`)'

      - name: Run benchmarks
        uses: CodSpeedHQ/action@4296e51e7041e24dadb86d1d6e8b9320d223dbe8 # v5.0.3
        with:
          run: yarn benchmark --ci
          mode: "simulation"
        env:
          LAST_COMMIT: 1
          NEGATIVE_FILTER: on-schedule
          SHARD: ${{ matrix.shard }}
          # Single libuv thread → deterministic fs-completion order, removing the
          # last I/O race that perturbs allocation counts between runs.
          UV_THREADPOOL_SIZE: 1
  benchmark-memory:
    strategy:
      fail-fast: false
      matrix:
        shard: [1/4, 2/4, 3/4, 4/4]
    runs-on: ubuntu-24.04
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-tags: true
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Pinned, not `lts/*`: CodSpeed compares this run against one recorded
          # days ago, and a Node patch moves memory peaks and instruction counts
          # on unchanged code. Bumping it re-baselines every benchmark at once.
          node-version: 24.19.0
          cache: yarn

      - run: yarn --frozen-lockfile

      - run: yarn link --frozen-lockfile || true

      - run: yarn link webpack --frozen-lockfile

      # The runner's CPU model still varies between runs; a whole shard moving at
      # once is that, not the diff. Recorded here so the log can say which.
      - name: Check Runner Environment
        run: |
          ldd --version | head -1
          node -e 'const os=require("os");
          const toGb=b=>(b/1024**3).toFixed(2)+" GB";
          console.log(`--- Runner ---\nNode:  ${process.version} (V8 ${process.versions.v8})\nCPU:   ${os.cpus()[0].model} x${os.cpus().length}\nTotal: ${toGb(os.totalmem())}\nFree:  ${toGb(os.freemem())}\nUsed:  ${toGb(os.totalmem()-os.freemem())}`)'

      - name: Run memory benchmarks
        uses: CodSpeedHQ/action@4296e51e7041e24dadb86d1d6e8b9320d223dbe8 # v5.0.3
        with:
          run: yarn benchmark --ci
          mode: "memory"
          token: ${{ secrets.CODSPEED_TOKEN }}
        env:
          LAST_COMMIT: 1
          NEGATIVE_FILTER: on-schedule
          SHARD: ${{ matrix.shard }}
          # Single libuv thread → deterministic fs-completion order, removing the
          # last I/O race that perturbs allocation counts between runs.
          UV_THREADPOOL_SIZE: 1
