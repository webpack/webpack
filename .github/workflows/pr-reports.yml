name: Pull Request Reports

# Keeps one comment on the pull request with the reports `publish-to-pkg-pr-new.yml`,
# `code-size.yml`, `types-coverage.yml`, `module-loading.yml` and
# `dependency-report.yml` upload. Every run rebuilds the whole comment from the
# latest run of each, so runs finishing together cannot drop a section.
# This runs in the base repository's context, so it never runs the PR's code.
on:
  # zizmor: ignore[dangerous-triggers] -- only `main` is checked out; artifact is data
  workflow_run:
    workflows:
      [
        Publish to pkg.pr.new,
        Code Size,
        Types Coverage,
        Module Loading,
        Dependency Report
      ]
    types: [completed]

concurrency:
  # One comment per branch; the newest run reads every report, so a cancelled
  # one loses nothing. The numeric repository id keeps the repository and
  # branch apart, as both names can contain hyphens.
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_repository.id }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

permissions: {}

jobs:
  comment:
    if: >
      github.repository == 'webpack/webpack' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      pull-requests: write
    steps:
      # `github.sha` of a `workflow_run` is the default branch's head, so this
      # is the base repository's own script, never the pull request's.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false

      - name: Find the pull request and the run of each report
        id: runs
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { findPullRequest, findReportRuns } = await import(
              `${process.env.GITHUB_WORKSPACE}/.github/scripts/pr-reports.mjs`
            );
            const run = context.payload.workflow_run;
            const pull = await findPullRequest({ github, context, run });
            if (!pull) {
              core.info(`No open pull request is at ${run.head_sha}, skipping.`);
              return;
            }
            const runs = await findReportRuns({ github, context, run });
            core.setOutput("pull", String(pull.number));
            core.setOutput("runs", JSON.stringify(runs));
            for (const [key, reportRun] of Object.entries(runs)) {
              if (reportRun.status === "completed") core.setOutput(key, String(reportRun.id));
            }

      # WHY: each artifact is written by the pull request's own run, whose
      # workflow file a fork can edit, so it is data only: never executed,
      # never interpolated into a shell, and its bytes are checked below.
      - name: Download the preview package report
        if: steps.runs.outputs.pkg-pr-new
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pr-report-pkg-pr-new
          path: ${{ runner.temp }}/pr-reports/pkg-pr-new
          run-id: ${{ steps.runs.outputs.pkg-pr-new }}
          github-token: ${{ github.token }}

      - name: Download the code size report
        if: steps.runs.outputs.code-size
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pr-report-code-size
          path: ${{ runner.temp }}/pr-reports/code-size
          run-id: ${{ steps.runs.outputs.code-size }}
          github-token: ${{ github.token }}

      - name: Download the types coverage report
        if: steps.runs.outputs.types-coverage
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pr-report-types-coverage
          path: ${{ runner.temp }}/pr-reports/types-coverage
          run-id: ${{ steps.runs.outputs.types-coverage }}
          github-token: ${{ github.token }}

      - name: Download the module loading report
        if: steps.runs.outputs.module-loading
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pr-report-module-loading
          path: ${{ runner.temp }}/pr-reports/module-loading
          run-id: ${{ steps.runs.outputs.module-loading }}
          github-token: ${{ github.token }}

      - name: Download the dependency report
        if: steps.runs.outputs.dependency
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pr-report-dependency
          path: ${{ runner.temp }}/pr-reports/dependency
          run-id: ${{ steps.runs.outputs.dependency }}
          github-token: ${{ github.token }}

      - name: Comment the reports on the pull request
        if: steps.runs.outputs.pull
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PULL_NUMBER: ${{ steps.runs.outputs.pull }}
          REPORT_RUNS: ${{ steps.runs.outputs.runs }}
          REPORTS_DIR: ${{ runner.temp }}/pr-reports
        with:
          script: |
            const { formatReportsComment, commentReports } = await import(
              `${process.env.GITHUB_WORKSPACE}/.github/scripts/pr-reports.mjs`
            );
            const body = formatReportsComment({
              runs: JSON.parse(process.env.REPORT_RUNS),
              reportsDir: process.env.REPORTS_DIR,
              headSha: context.payload.workflow_run.head_sha,
              warn: (message) => core.warning(message)
            });
            await commentReports({
              github,
              context,
              issueNumber: Number(process.env.PULL_NUMBER),
              body
            });
