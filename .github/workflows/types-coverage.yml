name: Types Coverage

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only on purpose, forks included: the report is uploaded as an artifact
# and posted by `pr-reports.yml`, which never runs this pull request's code.
permissions:
  contents: read
  pull-requests: read

jobs:
  types-coverage:
    if: github.repository == 'webpack/webpack'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: yarn

      - run: node tooling/retry.js yarn --frozen-lockfile

      - run: yarn link --frozen-lockfile || true

      - run: yarn link webpack --frozen-lockfile

      - name: Generate the declarations the type check reads
        run: yarn fix:special

      - name: Collect types coverage
        run: yarn types:cover:report

      # `output-file` renders the comment without posting it, which is all a
      # fork's token allows; `pulls.get` for the title only needs read access.
      - name: Render the report
        uses: Nef10/lcov-reporter-action@797ec1c1e78e3a9a7890c1a104d58b9e05fcef76 # v0.6.1
        with:
          pr-number: ${{ github.event.pull_request.number }}
          lcov-file: ./coverage/lcov.info
          title: Types Coverage
          output-file: lcov-report.md

      - name: Mark the report for the commenter
        run: |
          {
            echo "<!-- types-coverage-report -->"
            cat lcov-report.md
          } > types-coverage-report.md
          cat lcov-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-report-types-coverage
          path: types-coverage-report.md
          retention-days: 90
