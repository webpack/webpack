name: Types Coverage

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  types-coverage:
    if: github.repository == 'webpack/webpack'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: yarn

      - run: node tooling/retry.js yarn --frozen-lockfile

      - run: yarn link --frozen-lockfile || true

      - run: yarn link webpack --frozen-lockfile

      - name: Generate the declarations the type check reads
        run: yarn fix:special

      # The escape-hatch counts compare with the pull request's base commit.
      - name: Fetch the base commit
        run: git fetch --no-tags --depth=1 origin "$BASE_SHA"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}

      # The same script, run on the base commit's tree, counts its inferred `any` and untyped identifiers.
      - name: Collect the base commit's inferred `any` and untyped identifiers
        run: |
          git worktree add --detach "$RUNNER_TEMP/base" "$BASE_SHA"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$RUNNER_TEMP/base/node_modules"
          node tooling/type-coverage.js --root "$RUNNER_TEMP/base" > /dev/null
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}

      # Renders the report too: overall typed lines, the escape hatches, `any` and
      # untyped identifiers this pull request adds or removes, and the files that still have some.
      - name: Collect types coverage
        run: node tooling/type-coverage.js --base "$BASE_SHA" --base-counts "$RUNNER_TEMP/base/coverage/type-counts.json"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}

      - name: Mark the report for the commenter
        run: |
          {
            echo "<!-- types-coverage-report -->"
            cat coverage/types-coverage.md
          } > types-coverage-report.md
          cat coverage/types-coverage.md coverage/types-coverage-spots.md >> "$GITHUB_STEP_SUMMARY"

      # `pr-reports.yml` puts this in the pull request's one report comment,
      # from the base repository's context: a fork's token is read-only.
      - name: Upload the report for the pull request comment
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr-report-types-coverage
          path: types-coverage-report.md
          retention-days: 90
