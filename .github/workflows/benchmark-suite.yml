name: Benchmark suite

on:
  schedule:
    - cron: "0 4 * * 1"
  pull_request:
    branches: [main]
    types: [labeled]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write
  issues: write
  pull-requests: write

jobs:
  select-benchmarks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      run: ${{ steps.selection.outputs.run }}
      filter: ${{ steps.selection.outputs.filter }}
      matrix: ${{ steps.selection.outputs.matrix }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - id: selection
        run: node .github/scripts/select-benchmarks.mjs

  benchmark-suite:
    needs: select-benchmarks
    if: needs.select-benchmarks.outputs.run == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select-benchmarks.outputs.matrix) }}
    runs-on: codspeed-macro
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Use Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: lts/*
          cache: yarn

      - run: yarn --frozen-lockfile

      - name: Run benchmark suite
        uses: CodSpeedHQ/action@4e969336ab9acd4f6f8d025fdd793292b0835df0 # v4.18.2
        with:
          run: yarn benchmark:suite --dir ${{ matrix.dir }}
          mode: "walltime"
        env:
          FILTER: ${{ needs.select-benchmarks.outputs.filter }}
          SHARD: ${{ matrix.shard }}
          # deterministic fs-completion order
          UV_THREADPOOL_SIZE: 1
