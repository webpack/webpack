name: Code Size

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Every push to `main` shares one group, so cancelling would leave the commits
  # in a burst of merges with no uploaded report — and a pull request based on
  # one of them with no baseline. Only a superseded pull request run is dropped.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  # Reading the baseline report from the run that produced it on `main`.
  actions: read
  # Posting the report as a pull request comment.
  pull-requests: write

jobs:
  code-size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: yarn

      - run: node tooling/retry.js yarn --frozen-lockfile

      - run: yarn link --frozen-lockfile || true

      - run: yarn link webpack --frozen-lockfile

      # The newest successful `main` run whose commit the measured tree already
      # contains. A run on a commit it does not contain charges this pull request
      # for whatever landed in between, so no baseline beats the wrong one.
      - name: Find the baseline run
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
          # The `main` commit this run measures against: a pull request's base,
          # or the pushed commit itself, whose parent is then the nearest match.
          REF_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
        run: |
          runs="repos/$GITHUB_REPOSITORY/actions/workflows/code-size.yml/runs"
          # Any run of `main` that is not a pull request: a manually dispatched
          # one is a baseline too, while a pull request whose head branch is
          # itself named `main` is not. The API takes one `event` at a time, so
          # the unwanted one is filtered out here rather than in the query.
          mine='.workflow_runs[] | select(.event != "pull_request")'
          # `|| true` throughout: without a baseline the run still reports its
          # own totals, so a query a fork's token may not answer must not fail
          # the job.
          exact="$runs?branch=main&head_sha=$REF_SHA&per_page=100"
          state="[$mine][0] | \"\(.status) \(.conclusion // \"none\") \(.id)\""
          run_id=""
          # Only the base commit's own report charges this pull request for its
          # own commits alone, and `main` moving is exactly when that run is
          # still going — so wait for it rather than settle for an older one.
          deadline=$(($(date +%s) + 600))
          while :; do
            read -r status conclusion id <<STATE
          $(gh api "$exact" --jq "$state" || true)
          STATE
            # No run for this commit at all, so there is nothing to wait for.
            [ -n "$status" ] || break
            if [ "$status" = "completed" ]; then
              [ "$conclusion" = "success" ] && run_id="$id"
              break
            fi
            [ "$(date +%s)" -lt "$deadline" ] || break
            echo "Base commit's run is $status, waiting…"
            sleep 30
          done
          # Failing that, the newest run the measured tree already contains. A
          # page of 100 because the filter above drops rows, and a page of 20
          # held too few `main` runs to reach one the base descends from.
          if [ -z "$run_id" ]; then
            keep="$mine | \"\(.head_sha) \(.id)\""
            candidates=$(gh api "$runs?branch=main&status=success&per_page=100" --jq "$keep" || true)
            checked=0
            while read -r sha id; do
              [ -n "$sha" ] || continue
              # Newest first, so the first ancestor is the closest. Capped: a
              # diverged history would otherwise compare every row.
              checked=$((checked + 1))
              [ "$checked" -le 20 ] || break
              # `ahead` means REF_SHA is ahead of that commit and `identical`
              # that they are the same — either way the tree contains it, so
              # the delta is this pull request's plus whatever landed between.
              compare="repos/$GITHUB_REPOSITORY/compare/$sha...$REF_SHA"
              contains=$(gh api "$compare" --jq .status || true)
              if [ "$contains" = "ahead" ] || [ "$contains" = "identical" ]; then
                run_id="$id"
                break
              fi
            done <<CANDIDATES
          $candidates
          CANDIDATES
          fi
          echo "run-id=$run_id" >> "$GITHUB_OUTPUT"
          echo "Baseline run: ${run_id:-none}, measured against $REF_SHA"

      - name: Download the baseline report
        if: steps.baseline.outputs.run-id != ''
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: code-size-report
          path: baseline
          run-id: ${{ steps.baseline.outputs.run-id }}
          github-token: ${{ github.token }}

      - name: Measure generated code size
        run: |
          yarn test:size \
            --output code-size-report.json \
            --baseline baseline/code-size-report.json \
            --summary code-size-report.md
          cat code-size-report.md >> "$GITHUB_STEP_SUMMARY"
        env:
          CODE_SIZE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          # The `main` commit the checked-out merge ref carries, so the report can
          # tell whether the baseline it found is that same commit.
          CODE_SIZE_BASE_COMMIT: ${{ github.event.pull_request.base.sha }}

      # On the pull request itself, not only in the job summary — a size change
      # nobody clicks through to see is a size change nobody sees. Updated in
      # place on every push, so the thread keeps one comment. Skipped for forks,
      # whose token cannot comment (the job summary still has the report).
      - name: Comment the report on the pull request
        if: >
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const body = require("fs").readFileSync("code-size-report.md", "utf8");
            const marker = "<!-- code-size-report -->";
            const comments = await github.paginate(
              github.rest.issues.listComments,
              { ...context.repo, issue_number: context.issue.number, per_page: 100 }
            );
            // Only a comment this workflow itself wrote: anyone can post one
            // carrying the marker, and overwriting it would let them edit the
            // report afterwards and pass their own numbers off as CI's.
            const previous = comments.find(
              (comment) =>
                comment.user.type === "Bot" &&
                comment.user.login === "github-actions[bot]" &&
                comment.body.startsWith(marker)
            );
            if (previous) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: previous.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: context.issue.number,
                body
              });
            }

      # Uploaded from `main` too — that upload is the next run's baseline.
      - name: Upload the report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: code-size-report
          path: code-size-report.json
          retention-days: 90
