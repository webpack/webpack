name: Code Size

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # Reading the baseline report from the run that produced it on `main`.
  actions: read

jobs:
  code-size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: yarn

      - run: yarn --frozen-lockfile

      - run: yarn link --frozen-lockfile || true

      - run: yarn link webpack --frozen-lockfile

      # The report `main` last produced. Prefer the run for this PR's base commit
      # and fall back to the newest successful one, so a PR opened against an
      # older `main` is still compared against something.
      - name: Find the baseline run
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          query="repos/$GITHUB_REPOSITORY/actions/workflows/code-size.yml/runs?branch=main&status=success&per_page=1"
          run_id=""
          # `|| true`: without a baseline the run still reports its own totals,
          # so a query a fork's token may not answer must not fail the job.
          if [ -n "$BASE_SHA" ]; then
            run_id=$(gh api "$query&head_sha=$BASE_SHA" --jq '.workflow_runs[0].id // empty' || true)
          fi
          if [ -z "$run_id" ]; then
            run_id=$(gh api "$query" --jq '.workflow_runs[0].id // empty' || true)
          fi
          echo "run-id=$run_id" >> "$GITHUB_OUTPUT"
          echo "Baseline run: ${run_id:-none}"

      - name: Download the baseline report
        if: steps.baseline.outputs.run-id != ''
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: code-size-report
          path: baseline
          run-id: ${{ steps.baseline.outputs.run-id }}
          github-token: ${{ github.token }}

      # `--summary` writes the comparison table to the job summary, so the size
      # delta of a change is one click away from the PR's checks.
      - name: Measure generated code size
        run: >
          yarn test:size
          --output code-size-report.json
          --baseline baseline/code-size-report.json
          --summary "$GITHUB_STEP_SUMMARY"
        env:
          CODE_SIZE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}

      # Uploaded from `main` too — that upload is the next run's baseline.
      - name: Upload the report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: code-size-report
          path: code-size-report.json
          retention-days: 90
