name: Module Loading

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # Posting the report as a pull request comment; a fork's token stays read-only.
  pull-requests: write

jobs:
  module-loading:
    if: github.repository == 'webpack/webpack'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: yarn

      - run: node tooling/retry.js yarn --frozen-lockfile

      # The counts compare with the pull request's base commit.
      - name: Check out the base commit
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git worktree add --detach "$RUNNER_TEMP/base" "$BASE_SHA"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$RUNNER_TEMP/base/node_modules"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}

      # This pull request's script measures both checkouts, so a scenario added
      # here is counted on the base too.
      - name: Count the modules each way of using webpack loads
        run: |
          node tooling/check-module-loading.js --base "$RUNNER_TEMP/base" --output module-loading.md
          {
            echo "<!-- module-loading-report -->"
            cat module-loading.md
          } > module-loading-report.md
          cat module-loading.md >> "$GITHUB_STEP_SUMMARY"

      # Updated in place on every push, so the thread keeps one comment.
      - name: Comment the report on the pull request
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { upsertReportComment } = await import(
              `${process.env.GITHUB_WORKSPACE}/.github/scripts/comment-report.mjs`
            );
            await upsertReportComment({
              github,
              context,
              issueNumber: context.issue.number,
              marker: "<!-- module-loading-report -->",
              report: require("fs").readFileSync("module-loading-report.md", "utf8")
            });

      # A fork's token cannot comment, so `pr-reports.yml` posts this from the
      # base repository's context, without running this pull request's code.
      - name: Upload the report for the pull request comment
        if: github.event.pull_request.head.repo.full_name != github.repository
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr-report-module-loading
          path: module-loading-report.md
          retention-days: 90
