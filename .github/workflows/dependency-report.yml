name: Dependency Report

# Only what changes the report: webpack's own `dependencies` live in
# `package.json`; `yarn.lock` is not read, since the install resolves afresh.
on:
  push:
    branches: [main]
    paths:
      - package.json
      - tooling/dependency-report.js
      - .github/workflows/dependency-report.yml
  pull_request:
    branches: [main]
    paths:
      - package.json
      - tooling/dependency-report.js
      - .github/workflows/dependency-report.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  dependency-report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*

      # Node builtins and npm only, so no `yarn install` first.
      - name: Report what installing webpack, webpack-cli and webpack-dev-server pulls in
        run: |
          node tooling/dependency-report.js \
            --output dependency-report.md \
            --json dependency-report.json
          cat dependency-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-report
          path: |
            dependency-report.md
            dependency-report.json
          retention-days: 90
