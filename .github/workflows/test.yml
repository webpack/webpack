name: Github Actions

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: yarn

      - run: node tooling/retry.js yarn --frozen-lockfile

      - name: Cache prettier result
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ./node_modules/.cache/prettier/.prettier-cache
          key: lint-prettier-${{ runner.os }}-node-${{ hashFiles('**/yarn.lock', '**/.prettierrc.js') }}
          restore-keys: lint-prettier-

      - name: Cache eslint result
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .eslintcache
          key: lint-eslint-${{ runner.os }}-node-${{ hashFiles('**/yarn.lock', '**/eslint.config.mjs') }}
          restore-keys: lint-eslint-

      - name: Cache cspell result
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cspellcache
          key: lint-cspell-${{ runner.os }}-node-${{ hashFiles('**/yarn.lock', '**/cspell.json') }}
          restore-keys: lint-cspell-

      - run: yarn lint

      - name: Validate types using old typescript version
        run: |
          node tooling/retry.js yarn upgrade typescript@5.0 @types/node@20
          node tooling/retry.js yarn --frozen-lockfile
          yarn validate:types

      - name: Validate changeset format
        if: github.event_name == 'pull_request'
        run: |
          yarn validate:changeset

  # What the CSS and HTML printers owe whatever they printed, which no
  # comparison against another tool can see: being a few bytes off its own best
  # is not being worse than a rival.
  invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: yarn

      - run: node tooling/retry.js yarn --frozen-lockfile

      # The framework stylesheets and documents the comparisons install, which
      # the sweep reads as well: the corpus a contributor builds is 34
      # stylesheets wider than the one a bare checkout holds, and a finding has
      # already lived in exactly those. Shares its key and its paths with the
      # equivalence job, so whichever runs first fills it for the other and the
      # 698 MB is stored once. ~20s on a hit, ~3 min on a miss.
      - name: Cache the comparison corpus
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules/.cache/css-tool-comparison
            node_modules/.cache/html-tool-comparison
          key: comparison-corpus-${{ runner.os }}-${{ hashFiles('tooling/comparison/css-tool-comparison/package.json', 'tooling/comparison/css-tool-comparison/package-lock.json', 'tooling/comparison/html-tool-comparison/package.json', 'tooling/comparison/html-tool-comparison/package-lock.json') }}

      # A key of its own rather than a third path on the one above: the
      # equivalence job shares that entry and reads neither the JavaScript
      # corpus nor a key that moves when it is bumped.
      - name: Cache the JavaScript comparison corpus
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.cache/js-tool-comparison
          key: comparison-corpus-js-${{ runner.os }}-${{ hashFiles('tooling/comparison/js-tool-comparison/package.json', 'tooling/comparison/js-tool-comparison/package-lock.json') }}

      # Fatal here, unlike the equivalence job: that one reads whichever
      # fixtures are there, and this one is the check that the whole corpus
      # stays clean. Retried rather than tolerated, a registry blip being the
      # only reason it fails.
      - name: Install the CSS comparison corpus
        run: node tooling/retry.js yarn benchmark:css-tools:setup

      - name: Install the HTML comparison corpus
        run: node tooling/retry.js yarn benchmark:html-tools:setup

      # The shipped bundles the JavaScript sweep reads, which are the shape most
      # of what a build parses is in. Installing it is also the half a bump
      # breaks — a manifest and lockfile `npm ci` refuses, or a platform package
      # the lockfile misses — so it is held to installing either way.
      - name: Install the JavaScript comparison corpus
        run: node tooling/retry.js yarn benchmark:js-tools:setup

      # `--require-corpus`: without it a sweep that lost a fixture reports the
      # findings of the ones it kept and passes, which is coverage lost with
      # nothing to read it off.
      - name: CSS printer invariants
        run: yarn test:invariants:css --require-corpus

      # One language's finding must not hide another's: each names a repro of
      # its own and all three are read in the same sitting. `!cancelled()`
      # rather than `always()`, so a cancelled run stops here instead of
      # sweeping again.
      - name: HTML printer invariants
        if: ${{ !cancelled() }}
        run: yarn test:invariants:html --require-corpus

      - name: JavaScript parser invariants
        if: ${{ !cancelled() }}
        run: yarn test:invariants:js --require-corpus

  validate-legacy-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 10.x
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 10.x
          cache: yarn

      # Remove `devDependencies` from `package.json` to avoid `yarn install` compatibility error
      - run: node -e "const content = require('./package.json');delete content.devDependencies;require('fs').writeFileSync('package.json', JSON.stringify(content, null, 2));"

      # `--ignore-engines`: some transitive deps (e.g. node-releases) declare
      # `engines.node >= 18` but run fine on old Node; matches the other legacy jobs
      - run: node tooling/retry.js yarn install --production --frozen-lockfile --ignore-engines

  basic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: yarn

      - run: node tooling/retry.js yarn --frozen-lockfile

      - run: yarn link --frozen-lockfile || true

      - run: yarn link webpack --frozen-lockfile

      - run: yarn test:basic --ci

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: yarn

      - run: node tooling/retry.js yarn --frozen-lockfile

      - run: yarn link --frozen-lockfile || true

      - run: yarn link webpack --frozen-lockfile

      - name: Cache jest result
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .jest-cache
          key: jest-unit-${{ runner.os }}-${{ hashFiles('**/yarn.lock', '**/jest.config.js') }}-${{ github.sha }}
          restore-keys: |
            jest-unit-${{ runner.os }}-${{ hashFiles('**/yarn.lock', '**/jest.config.js') }}-
            jest-unit-${{ runner.os }}-

      - run: yarn cover:unit --ci --cacheDirectory .jest-cache

      - name: Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          flags: unit
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # Every suite from here down is held behind the three cheap ones, which are
  # also the three a merge needs: each costs tens of runner-minutes, and a tree
  # that fails `lint`, `basic` or `unit` is not going to land on what they say.
  test262:
    needs: [lint, basic, unit]
    strategy:
      fail-fast: false
      matrix:
        shard: [1/2, 2/2]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check out the test262 corpus
        run: node tooling/retry.js git submodule update --init --depth 1 test/external/test262-cases

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Pinned; revert to "latest" once https://github.com/nodejs/node/issues/63715 is resolved
          node-version: "26.2.0"
          cache: yarn

      - run: node tooling/retry.js yarn --frozen-lockfile

      - run: yarn link --frozen-lockfile || true

      - run: yarn link webpack --frozen-lockfile

      - name: Cache jest result
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .jest-cache
          key: jest-test262-${{ matrix.shard }}-${{ runner.os }}-${{ hashFiles('**/yarn.lock', '**/jest.config.js') }}-${{ github.sha }}
          restore-keys: |
            jest-test262-${{ matrix.shard }}-${{ runner.os }}-${{ hashFiles('**/yarn.lock', '**/jest.config.js') }}-
            jest-test262-${{ matrix.shard }}-${{ runner.os }}-

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tc39/test262
          path: test/js/test262
          ref: f2d59ea6e4b2f6f87de9f0d18a41d73782b6a9bc

      - run: yarn cover:test262 --ci --cacheDirectory .jest-cache
        env:
          SHARD: ${{ matrix.shard }}

      - name: Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          flags: test262
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # One job per language, the way `runtimes` is one per runtime: each reads that
  # language's upstream corpus, and they differ only in which submodule they
  # check out and which suite they run.
  parser:
    # Named for the language alone: a matrix row carries the suite and the
    # coverage flag too, and the generated name would otherwise print all three.
    name: parser (${{ matrix.language }})
    needs: [lint, basic, unit]
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: css
            submodules: test/external/css-parsing-tests
            script: cover:css-parsing
            flags: css-parsing
          # WPT is 161k files, so only this leg checks it out, and only one
          # commit deep — it carries the tree-construction corpus html5lib-tests
          # dropped.
          - language: html
            submodules: test/external/html5lib-tests test/external/wpt
            script: cover:html5lib
            flags: html5lib
          # Parses all of test262 with webpack's parser and with acorn and
          # compares the trees. Coverage instrumentation makes the parser ~5x
          # slower, so this leg runs without it — every line it reaches is
          # covered by the suites that upload.
          - language: js
            submodules: test/external/test262-cases
            script: test:test262-parser
          # Minifies every case of terser's own corpus with terser as published
          # and with webpack's printer, and requires the same bytes back.
          - language: js-printer
            submodules: test/external/terser
            script: test:terser
    runs-on: ubuntu-latest
    # Bounded: the js leg allows ten minutes per area per mode, so a stall
    # would otherwise hold a runner for the 6h default.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check out the ${{ matrix.language }} corpus
        run: node tooling/retry.js git submodule update --init --depth 1 ${{ matrix.submodules }}

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: yarn

      - run: node tooling/retry.js yarn --frozen-lockfile

      - run: yarn link --frozen-lockfile || true

      - run: yarn link webpack --frozen-lockfile

      - name: Cache jest result
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .jest-cache
          key: jest-parser-${{ matrix.language }}-${{ runner.os }}-${{ hashFiles('**/yarn.lock', '**/jest.config.js') }}-${{ github.sha }}
          restore-keys: |
            jest-parser-${{ matrix.language }}-${{ runner.os }}-${{ hashFiles('**/yarn.lock', '**/jest.config.js') }}-
            jest-parser-${{ matrix.language }}-${{ runner.os }}-

      - run: yarn ${{ matrix.script }} --ci --cacheDirectory .jest-cache

      - name: Codecov
        if: matrix.flags
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          flags: ${{ matrix.flags }}
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # One job per engine, the way `runtimes` is one per runtime: a rewrite only
  # one engine reads differently is invisible to a suite that asks one, and
  # several of the defects filed today are ones only Gecko sees.
  syntax-equivalence:
    # Named for the engine alone: a matrix row carries the script and the
    # coverage flag too, and the generated name would otherwise print all three.
    name: syntax-equivalence (${{ matrix.browser }})
    needs: [lint, basic, unit]
    strategy:
      fail-fast: false
      matrix:
        include:
          # Chrome's run is the one that reports coverage. Both cover the same
          # lines, so a second uploader would only leave every pull request a
          # report short until the other engine lands.
          - browser: chrome
            script: cover:syntax-equivalence
            coverage: true
          - browser: firefox
            script: test:syntax-equivalence
          - browser: webkit
            script: test:syntax-equivalence
    runs-on: ubuntu-latest
    # Bounded: a hung browser would otherwise hold a runner for the 6h default.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This job runs repository-controlled scripts, and the corpus is public.
          persist-credentials: false

      # Held to both corpora: webpack's own fixtures and the web's. WPT is 161k
      # files, so it is checked out one commit deep.
      - name: Check out the WPT corpus
        run: node tooling/retry.js git submodule update --init --depth 1 test/external/wpt

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: yarn

      - run: node tooling/retry.js yarn --frozen-lockfile

      - run: yarn link --frozen-lockfile || true

      - run: yarn link webpack --frozen-lockfile

      # Keyed on each corpus's manifest and lockfile; a cache predating an edit
      # to either is rebuilt by the install below, which reinstalls whenever the
      # recorded pair differs from the wanted one.
      - name: Cache the comparison corpus
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules/.cache/css-tool-comparison
            node_modules/.cache/html-tool-comparison
          key: comparison-corpus-${{ runner.os }}-${{ hashFiles('tooling/comparison/css-tool-comparison/package.json', 'tooling/comparison/css-tool-comparison/package-lock.json', 'tooling/comparison/html-tool-comparison/package.json', 'tooling/comparison/html-tool-comparison/package-lock.json') }}

      # The third corpus: the framework stylesheets and documents the tool
      # comparisons install. Not fatal — the suite reads whichever fixtures are
      # there and reports the tier as not built when the install did not land, so
      # a registry outage costs that corpus rather than the job.
      # One step each: `run` stops at the first command that fails, so a single
      # block would cost both corpora where only one install went wrong.
      - name: Install the CSS comparison corpus
        continue-on-error: true
        run: yarn benchmark:css-tools:setup

      - name: Install the HTML comparison corpus
        continue-on-error: true
        run: yarn benchmark:html-tools:setup

      # Chrome comes with the runner. Firefox is fetched, and deliberately not
      # cached: the build id resolves to whatever `stable` is today, so a cache
      # key that never moves would pin the engine this suite exists to track.
      - name: Install Firefox
        if: matrix.browser == 'firefox'
        run: node tooling/retry.js yarn setup:firefox

      # `--with-deps` because a runner carries none of WebKit's shared
      # libraries, where it already carries Chrome's.
      - name: Install WebKit
        if: matrix.browser == 'webkit'
        run: node tooling/retry.js node node_modules/playwright-core/cli.js install --with-deps webkit

      - name: Cache jest result
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .jest-cache
          key: jest-syntax-equivalence-${{ matrix.browser }}-${{ runner.os }}-${{ hashFiles('**/yarn.lock', '**/jest.config.js') }}-${{ github.sha }}
          restore-keys: |
            jest-syntax-equivalence-${{ matrix.browser }}-${{ runner.os }}-${{ hashFiles('**/yarn.lock', '**/jest.config.js') }}-
            jest-syntax-equivalence-${{ matrix.browser }}-${{ runner.os }}-

      - run: yarn ${{ matrix.script }} --ci --cacheDirectory .jest-cache
        env:
          EQUIVALENCE_BROWSER: ${{ matrix.browser }}

      - name: Codecov
        if: matrix.coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          flags: syntax-equivalence
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # Run webpack's test suite under Deno and Bun (spec validation suites excluded).
  runtimes:
    needs: [lint, basic, unit]
    strategy:
      fail-fast: false
      matrix:
        runtime: [deno, bun]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: yarn

      - name: Use Deno
        if: matrix.runtime == 'deno'
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x

      - name: Use Bun
        if: matrix.runtime == 'bun'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - run: node tooling/retry.js yarn --frozen-lockfile

      - run: yarn link --frozen-lockfile || true

      - run: yarn link webpack --frozen-lockfile

      # Bun runs with worker_threads (see test:base:bun): in-band's single heap
      # OOMs the runner on the full suite and Bun's child_process workers hang, but
      # threads work once jest-worker loads the Bun preload per thread. Apply that
      # patch here (Bun only) rather than via a repo-wide postinstall. The
      # jest-runner patch tolerates Bun's transient memoryUsage failures. The
      # jest-worker patch also has a Bun worker end itself rather than be
      # terminated from the parent, which segfaults Bun on an idle-memory restart
      # — and exit once it has, since ending only drops its message listener and
      # a worker still holding a handle would never be replaced. That buys Bun a
      # restart it would not otherwise survive, but not a run full of them, so the
      # limit has to sit above what the suite actually uses (see test:base:bun).
      - if: matrix.runtime == 'bun'
        run: |
          git apply test/patches/jest-worker+30.4.1.patch
          git apply test/patches/jest-runner+30.4.2.patch

      # Both runtimes run the same suites with jest's parallel workers, the
      # HotTestCases ones included. Only the Chrome-driven suites are dropped
      # (see the testPathIgnorePatterns in test:deno / test:bun), because
      # puppeteer-core does not load under either.
      - run: yarn test:${{ matrix.runtime }} --ci

  integration:
    needs: [lint, basic, unit]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [22.x, 24.x, 26.x]
        part: [a, b]
        include:
          # Test with main branches of webpack dependencies
          - os: ubuntu-latest
            node-version: lts/*
            part: a
            use_main_branches: 1
          - os: ubuntu-latest
            node-version: lts/*
            part: b
            use_main_branches: 1
          # Test on old Node.js versions
          - os: ubuntu-latest
            node-version: 20.x
            part: a
          - os: ubuntu-latest
            node-version: 18.x
            part: a
          - os: ubuntu-latest
            node-version: 16.x
            part: a
          - os: ubuntu-latest
            node-version: 14.x
            part: a
          - os: ubuntu-latest
            node-version: 12.x
            part: a
          # The shipped baseline. Ubuntu only: the Node 10 job exists to catch
          # syntax and APIs newer than 10.13 in `lib/`, which is the same source
          # on every platform, so Windows and macOS repeat it for nothing.
          - os: ubuntu-latest
            node-version: 10.x
            part: a
          - os: ubuntu-latest
            node-version: 10.x
            part: b
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: yarn

      # Install old `jest` version and deps for legacy node versions
      - run: |
          node tooling/retry.js yarn upgrade jest@^27.5.0 jest-circus@^27.5.0 jest-cli@^27.5.0 jest-diff@^27.5.0 jest-environment-node@^27.5.0 jest-snapshot@^27.5.0 jest-junit@^13.0.0 @types/jest@^27.4.0 pretty-format@^27.0.2 husky@^8.0.3 lint-staged@^13.2.1 cspell@^6.31.1 open-cli@^7.2.0 coffee-loader@^1.0.0 babel-loader@^8.1.0 style-loader@^2.0.0 css-loader@^5.0.1 less-loader@^8.1.1 less@4.5.1 mini-css-extract-plugin@^1.6.1 nyc@^15.1.0 memfs@4.14.0 toml@^4.3.0 --ignore-engines
          node tooling/retry.js yarn --frozen-lockfile --ignore-engines
        if: matrix.node-version == '10.x' || matrix.node-version == '12.x' || matrix.node-version == '14.x'

      - run: |
          node tooling/retry.js yarn upgrade jest@^27.5.0 jest-circus@^27.5.0 jest-cli@^27.5.0 jest-diff@^27.5.0 jest-environment-node@^27.5.0 jest-snapshot@^27.5.0 jest-junit@^13.0.0 @types/jest@^27.4.0 pretty-format@^27.0.2 husky@^8.0.3 lint-staged@^13.2.1 nyc@^15.1.0 coffee-loader@1.0.0 babel-loader@^8.1.0 style-loader@^2.0.0 css-loader@^5.0.1 less-loader@^8.1.1 mini-css-extract-plugin@^1.6.1 toml@^4.3.0 --ignore-engines
          node tooling/retry.js yarn --frozen-lockfile
        if: matrix.node-version == '16.x'

      - run: |
          node tooling/retry.js yarn upgrade cspell@^8.8.4 lint-staged@^15.2.5 toml@^4.3.0 --ignore-engines
          node tooling/retry.js yarn --frozen-lockfile
        if: matrix.node-version == '18.x'

      - run: |
          node tooling/retry.js yarn upgrade cspell@^9 --ignore-engines
          node tooling/retry.js yarn --frozen-lockfile
        if: matrix.node-version == '20.x'

      - run: |
          node tooling/retry.js yarn upgrade pkg-pr-new@0.0.66
          node tooling/retry.js yarn --frozen-lockfile
        if: matrix.node-version == '22.x'

      # Install main version of our deps
      - run: node tooling/retry.js yarn upgrade enhanced-resolve@webpack/enhanced-resolve#main loader-runner@webpack/loader-runner#main webpack-sources@webpack/webpack-sources#main watchpack@webpack/watchpack#main tapable@webpack/tapable#main
        if: matrix.use_main_branches == '1'

      # Install dependencies for LTS node versions
      - run: node tooling/retry.js yarn --frozen-lockfile
        if: matrix.node-version != '10.x' && matrix.node-version != '12.x' && matrix.node-version != '14.x' && matrix.node-version != '16.x' && matrix.node-version != '18.x' && matrix.node-version != '20.x' && matrix.node-version != '22.x'

      - run: yarn link --frozen-lockfile || true

      - run: yarn link webpack --frozen-lockfile

      - name: Cache jest result
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .jest-cache
          key: jest-integration-${{ runner.os }}-node-${{ matrix.node-version }}-${{ matrix.part }}-${{ hashFiles('**/yarn.lock', '**/jest.config.js') }}-${{ github.sha }}
          restore-keys: |
            jest-integration-${{ runner.os }}-node-${{ matrix.node-version }}-${{ matrix.part }}-${{ hashFiles('**/yarn.lock', '**/jest.config.js') }}-
            jest-integration-${{ runner.os }}-node-${{ matrix.node-version }}-${{ matrix.part }}-

      - run: yarn cover:integration:${{ matrix.part }} --ci --cacheDirectory .jest-cache || yarn cover:integration:${{ matrix.part }} --ci --cacheDirectory .jest-cache -f
        env:
          MAIN_BRANCHES: ${{ matrix.use_main_branches }}
        if: matrix.node-version != '10.x' && matrix.node-version != '12.x' && matrix.node-version != '14.x' && matrix.node-version != '16.x' && matrix.node-version != '18.x' && matrix.node-version != '20.x'

      # Don't run code coverage analysis on older versions of NodeJS, this will speed up our CI
      - run: yarn test:integration:${{ matrix.part }} --ci --cacheDirectory .jest-cache || yarn test:integration:${{ matrix.part }} --ci --cacheDirectory .jest-cache -f
        if: matrix.node-version == '10.x' || matrix.node-version == '12.x' || matrix.node-version == '14.x' || matrix.node-version == '16.x' || matrix.node-version == '18.x' || matrix.node-version == '20.x'

      - run: yarn report:cover:merge
        if: matrix.node-version != '10.x' && matrix.node-version != '12.x' && matrix.node-version != '14.x' && matrix.node-version != '16.x' && matrix.node-version != '18.x' && matrix.node-version != '20.x'

      - name: Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./coverage/coverage-nyc.json,./coverage/coverage-final.json
          directory: ./coverage/
          disable_search: true
          flags: integration
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        if: matrix.node-version != '10.x' && matrix.node-version != '12.x' && matrix.node-version != '14.x' && matrix.node-version != '16.x' && matrix.node-version != '18.x' && matrix.node-version != '20.x'

  # The eight benchmark shards are around four runner-hours, so on a pull
  # request they come through here, behind the same three cheap jobs. A push to
  # `main` runs `benchmarks.yml` on its own trigger instead and is never gated:
  # CodSpeed draws every later comparison against that commit's baseline.
  benchmarks:
    if: github.event_name == 'pull_request'
    needs: [lint, basic, unit]
    # At least what the called workflow declares, or the call is rejected.
    permissions:
      contents: read
      id-token: write
      issues: write
      pull-requests: write
    uses: ./.github/workflows/benchmarks.yml
    secrets: inherit
