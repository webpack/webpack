version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 20
    labels:
      - dependencies
    versioning-strategy: widen
    groups:
      # The engines the browser suites compare against: puppeteer-core pins the
      # Chrome and Firefox builds CI installs, playwright-core the WebKit one.
      # Their own pull request, so a new engine reds only the bump that brought
      # it, and an engine-quirk probe failing there says which workaround can go.
      browsers:
        patterns:
          - "puppeteer-core"
          - "@puppeteer/browsers"
          - "playwright-core"
      dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - "puppeteer-core"
          - "@puppeteer/browsers"
          - "playwright-core"
        update-types:
          - "minor"
          - "patch"
      dependencies-major:
        patterns:
          - "*"
        update-types:
          - "major"
        exclude-patterns:
          - "rimraf"
          - "puppeteer-core"
          - "@puppeteer/browsers"
          - "playwright-core"
  # The corpora the comparison scripts measure against, one manifest each. They
  # reach no webpack build, so a bump is only ever a wider corpus to sweep — and
  # a bump that breaks a printer invariant reds its own pull request, where it
  # is attributable, rather than somebody else's.
  - package-ecosystem: npm
    directories:
      - "/tooling/comparison/css-tool-comparison"
      - "/tooling/comparison/html-tool-comparison"
      - "/tooling/comparison/js-tool-comparison"
      - "/tooling/comparison/xml-tool-comparison"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - "area: tooling"
    # `increase` rather than the root's `widen`: these are pinned exactly, so a
    # bump replaces the version rather than loosening the range it sits in.
    versioning-strategy: increase
    groups:
      comparison-corpus:
        patterns:
          - "*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 20
    labels:
      - dependencies
    groups:
      dependencies:
        patterns:
          - "*"
  - package-ecosystem: "gitsubmodule"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 20
    labels:
      - dependencies
    groups:
      dependencies:
        patterns:
          - "*"
